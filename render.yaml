# Render Blueprint — provisions BarnBound's web service + PostgreSQL together.
# Deploy: Render Dashboard → New + → Blueprint → select the "barnbound" repo.
# Render reads this file, creates both resources, and wires DATABASE_URL automatically.

databases:
  - name: barnbound-db
    databaseName: barnbound
    user: barnbound
    plan: free            # Free DB expires ~30 days. Upgrade to basic-256mb before launch.
    region: oregon

services:
  - type: web
    name: barnbound
    runtime: docker
    repo: https://github.com/stikman28/barnbound
    branch: main
    region: oregon
    plan: starter         # Always-on (~$7/mo). Needed for a smooth custom-domain experience.
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    healthCheckPath: /api/health
    autoDeploy: true
    domains:
      - barn-bound.com
      - www.barn-bound.com
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: barnbound-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true   # Render generates a strong secret and keeps it stable.
      - key: NODE_ENV
        value: production
